default normal

label normal
  kernel /boot/Image
  fdtdir /boot
  fdt /boot/rockchip/rk3566-radxa-zero-3w-aic8800ds2.dtb
  append quiet loglevel=1 root=PARTLABEL=rootfs ro earlycon rootwait init=/init video=HDMI-A-1:1280x720R@100e

label verbose
  kernel /boot/Image
  fdtdir /boot
  fdt /boot/rockchip/rk3566-radxa-zero-3w-aic8800ds2.dtb
  append loglevel=8 root=PARTLABEL=rootfs ro earlycon rootwait init=/init console=tty0 console=ttyFIQ0,1500000n8 console=ttyS2,1500000n8
