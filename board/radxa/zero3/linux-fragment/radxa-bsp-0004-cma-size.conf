# The Radxa Zero 3 ships in 1/2/4/8GB RAM variants across our board
# overlays (runcam, emax, radxa_zero3, openipc_bonnet). On >=2GB variants,
# RGA2's MMU can only address physical memory below the 4GB line, and a
# kernel bug (__GFP_DMA32 is only ever applied under CONFIG_ARM_LPAE, a
# 32-bit-only symbol never set on this arm64 kernel -- see
# drivers/gpu/drm/rockchip/rockchip_drm_gem.c) means ordinary buffers can
# silently land above it, corrupting or failing RGA jobs. PixelPilot works
# around this by CMA-allocating its DVR-reencode buffers (~20MB total)
# instead, since CMA reservations are guaranteed to sit below 4GB, gated
# at runtime on actual installed RAM (see mem_info.h in PixelPilot_rk) --
# so this larger pool is simply unused reserved memory on 1GB boards,
# where that code path never runs. The default 16MiB pool is already
# shared with other consumers (display, video decode scratch); size it up
# so DVR-reencode doesn't starve them. Applied to all Zero3 variants
# rather than the affected boards only, since the DVR-reencode buffer
# need is fixed (~20MB) regardless of total board RAM, and the extra
# reservation is negligible even on the tightest (1GB) variant.
#
# CONFIG_CMA_SIZE_SEL_MBYTES pinned explicitly alongside the size itself:
# it's already the base rockchip_linux defconfig's selected mode today, so
# this line is currently redundant, but CONFIG_CMA_SIZE_MBYTES only takes
# effect under that mode -- if the base defconfig ever switches to
# percentage/min-based sizing, CONFIG_CMA_SIZE_MBYTES=32 below would
# silently stop applying without this.
CONFIG_CMA_SIZE_SEL_MBYTES=y
CONFIG_CMA_SIZE_MBYTES=32
