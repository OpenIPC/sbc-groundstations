default normal

label normal
  kernel /boot/Image
  fdtdir /boot
  fdtoverlays /boot/rockchip/rk3568-i2c3-m0.dtb /boot/rockchip/rk3566-ina226-overlay.dtb
  append quiet loglevel=1 root=PARTLABEL=rootfs ro earlycon rootwait init=/init

label verbose
  kernel /boot/Image
  fdtdir /boot
  fdtoverlays /boot/rockchip/rk3568-i2c3-m0.dtb /boot/rockchip/rk3566-ina226-overlay.dtb
  append loglevel=8 root=PARTLABEL=rootfs ro earlycon rootwait init=/init console=tty0 console=ttyFIQ0,1500000n8 console=ttyS2,1500000n8
